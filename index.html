<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>患者管理</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="患者管理">
<meta name="theme-color" content="#1f6f55">
<meta name="robots" content="noindex,nofollow">
<style>
html,body{height:100%;margin:0;background:#1f6f55;color:#fff;font-family:-apple-system,"Hiragino Sans",sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:24px;box-sizing:border-box}
img{width:96px;height:96px;border-radius:22px}
a.btn{display:inline-block;background:#fff;color:#1f6f55;font-weight:700;font-size:18px;padding:14px 32px;border-radius:12px;text-decoration:none}
p{margin:0;font-size:14px;line-height:1.7;opacity:.9}
</style>
<script>
var APP_URL = "https://script.google.com/a/macros/gesetmedical.jp/s/AKfycbwN5IVsM3JWkKu-Ke8jZhtBxvEOfw-TdRuHuhAOF8T97QoRzOzNzoxgeE_ecvas5BIG/exec";
// ホーム画面のアイコンから開いたとき（アプリ表示のとき）だけ、自動で本体へ移動する。
// Safari で普通に開いたときは移動せず、ホーム画面に追加できるようにする。
var isStandalone = (window.navigator.standalone === true) ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
if (isStandalone) { location.replace(APP_URL); }
</script>
</head>
<body>
<img src="apple-touch-icon.png" alt="">
<a class="btn" href="https://script.google.com/a/macros/gesetmedical.jp/s/AKfycbwN5IVsM3JWkKu-Ke8jZhtBxvEOfw-TdRuHuhAOF8T97QoRzOzNzoxgeE_ecvas5BIG/exec">アプリを開く</a>
<p>ホーム画面に追加するときは、<br>共有ボタン →「ホーム画面に追加」を押してください。<br>追加したアイコンから開くと、自動でアプリに移動します。</p>
</body>
</html>
